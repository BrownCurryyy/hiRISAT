services:
  - type: web
    name: hirisat-backend
    runtime: python
    pythonVersion: 3.12
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app:app
    autoDeploy: true
    branch: main
